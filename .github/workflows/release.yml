name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --release --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Assemble exe and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, tools | Out-Null
          Copy-Item target/release/SETTConverter.exe dist/

          # Pinned upstream builds; the app downloads this bundle on first use.
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.7z" `
            -OutFile ffmpeg.7z
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-x64.exe" `
            -OutFile 7z-installer.exe

          $pins = @{
            "ffmpeg.7z" = "835b9a733445ba7a56a37a26cf7bde84e2f3ce7da2a8ec984276bb2abb1b922c"
            "7z-installer.exe" = "9b697f65ecc2d9b0152f5ee96d72dde522a7827690349d9307935dacf40f42ec"
          }
          foreach ($file in $pins.Keys) {
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $pins[$file]) { throw "${file}: SHA-256 mismatch ($actual)" }
          }

          $seven = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $seven) { $seven = "$env:ProgramFiles\7-Zip\7z.exe" }

          & $seven x ffmpeg.7z -offmpeg -y | Out-Null
          & $seven x 7z-installer.exe -o7zip -y | Out-Null

          $ffmpeg = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $license = Get-ChildItem ffmpeg -Recurse -Filter LICENSE | Select-Object -First 1
          Copy-Item $ffmpeg.FullName tools/ffmpeg.exe
          Copy-Item $license.FullName tools/ffmpeg-LICENSE.txt
          Copy-Item 7zip/7z.exe, 7zip/7z.dll, 7zip/License.txt tools/

          Compress-Archive -Path tools/* -DestinationPath dist/tools-win64.zip
          $zipHash = (Get-FileHash dist/tools-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  tools-win64.zip" | Set-Content dist/tools-win64.sha256 -Encoding ascii

          Get-FileHash dist/SETTConverter.exe, dist/tools-win64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS -Encoding ascii

          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: settconv-win64
          path: dist/*

      - name: Winget manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $hash = (Get-FileHash dist/SETTConverter.exe -Algorithm SHA256).Hash.ToLower()
          @"
          PackageIdentifier: OtavioZanon.SETTConverter
          PackageVersion: $version
          PackageName: SETTConverter
          Publisher: Otavio Zanon
          License: MIT
          ShortDescription: Portable file converter for Windows
          PackageUrl: https://github.com/otaviozanon/SETTConverter
          Installers:
          - Architecture: x64
            InstallerType: portable
            InstallerUrl: https://github.com/otaviozanon/SETTConverter/releases/download/$env:GITHUB_REF_NAME/SETTConverter.exe
            InstallerSha256: $hash
            Commands:
            - SETTConverter
          ManifestType: singleton
          ManifestVersion: 1.6.0
          "@ | Set-Content dist/OtavioZanon.SETTConverter.yaml -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SETTConverter.exe
            dist/tools-win64.zip
            dist/tools-win64.sha256
            dist/SHA256SUMS
            dist/OtavioZanon.SETTConverter.yaml
          generate_release_notes: true
